name: Publish results page

# The page is published from measurements produced on real hardware and committed
# to docs/ — never generated by CI, because latency numbers from a shared runner
# are not worth publishing as the headline result.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fail if no page has been published
        run: |
          if [ ! -f docs/index.html ]; then
            echo "docs/index.html is missing."
            echo "Run ./bench/run_benchmark.sh, then ./scripts/publish_page.sh"
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
