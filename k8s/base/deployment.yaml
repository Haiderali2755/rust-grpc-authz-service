apiVersion: apps/v1
kind: Deployment
metadata:
  name: authz
  labels: {app: authz}
spec:
  replicas: 3
  selector:
    matchLabels: {app: authz}
  template:
    metadata:
      labels: {app: authz}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      # Gate start-up on Redis being reachable. Without this the service can
      # start before its dependency exists, block on connecting, and fail the
      # startup probe — ordering belongs here rather than in retry logic.
      initContainers:
        - name: wait-for-redis
          image: redis:7-alpine
          command:
            - sh
            - -c
            - |
              until redis-cli -u "$REDIS_URL" ping 2>/dev/null | grep -q PONG; do
                echo "waiting for redis..."
                sleep 2
              done
              echo "redis is up"
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef: {name: authz-redis, key: url}
          resources:
            requests: {cpu: "50m", memory: "16Mi"}
            limits:   {cpu: "100m", memory: "32Mi"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      containers:
        - name: authz
          image: ghcr.io/haiderali2755/authz-service:latest
          ports:
            - {name: grpc, containerPort: 50051}
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef: {name: authz-redis, key: url}
            - {name: RUST_LOG, value: info}
          # Requests and limits are equal, giving the pod a Guaranteed QoS class.
          # For a latency-sensitive service this matters: Burstable pods can be
          # CPU-throttled mid-request, which shows up directly in tail latency.
          resources:
            requests: {cpu: "500m", memory: "64Mi"}
            limits:   {cpu: "500m", memory: "64Mi"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          # gRPC-native probes (Kubernetes >= 1.24) rather than shelling out to
          # a health binary — the image ships no shell. These require the
          # standard grpc.health.v1.Health service, registered via tonic-health.
          #
          # A startupProbe owns the slow-start window so livenessProbe does not:
          # a liveness probe that fires during start-up restarts the container in
          # a loop, which is what happened on a slow CI runner before this was
          # added. Liveness only begins once startup has succeeded once.
          startupProbe:
            grpc: {port: 50051}
            periodSeconds: 2
            failureThreshold: 30   # up to 60s to come up
            timeoutSeconds: 3
          readinessProbe:
            grpc: {port: 50051}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            grpc: {port: 50051}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      # Give in-flight RPCs time to drain before SIGKILL.
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: authz
  labels: {app: authz}
spec:
  # Headless: gRPC keeps long-lived HTTP/2 connections, so a normal ClusterIP
  # would pin each client to one pod and defeat load balancing. Clients resolve
  # all pod IPs and balance per-request themselves.
  clusterIP: None
  selector: {app: authz}
  ports:
    - {name: grpc, port: 50051, targetPort: grpc}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: authz
spec:
  minAvailable: 2
  selector:
    matchLabels: {app: authz}
