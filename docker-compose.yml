services:
  redis:
    image: redis:7-alpine
    # appendonly off: this is a benchmark of the service, not of Redis durability.
    # Do not copy this setting into production.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  authz:
    build: .
    environment:
      REDIS_URL: redis://redis:6379
      RUST_LOG: info
    ports: ["50051:50051"]
    depends_on:
      redis: {condition: service_healthy}
    cpus: 2.0
    mem_limit: 512m
