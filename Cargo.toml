[package]
name = "authz-service"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = "0.12"
# health: implements grpc.health.v1.Health, which is what Kubernetes `grpc`
# probes call. A custom Health RPC does not satisfy them.
tonic-health = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tower = "0.5"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "script"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-build = "0.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
